# Scheduled worker: pulls the daily report from the app and posts it to Slack.
#
# Deliberately separate from the Next app. The app is request-driven and has no
# timer of its own, and this keeps the Slack credential out of the public web
# app — only this worker can post.

name = "onboarding-daily-report"
main = "src/index.ts"
compatibility_date = "2026-08-04"

# Cron triggers run in UTC, always. 03:30 UTC = 09:00 IST.
# Change both this and the comment together, or the next reader will be misled.
# India has no DST, so a fixed UTC cron holds 09:00 IST all year.
#
# 09:00 IST, and the report covers the PREVIOUS IST day - so Day 1's report
# lands on Day 2 morning, 90 minutes before the 10:30 unlock. The worker picks
# the date itself (`istReportDate` in src/index.ts); moving the cron without
# moving that, or the reverse, silently reports the wrong day.
#
# The day field is `SUN,TUE-SAT`: EVERY DAY EXCEPT MONDAY. The office runs
# Mon-Sat, and each run reports the day before, so the Monday run is the only one
# with nothing to cover - it would report Sunday. Sunday is listed on its own
# because the week starts there, so no single range spans Sat->Sun.
#
# NAMED DAYS, NOT NUMBERS, AND DO NOT "SIMPLIFY" THEM BACK.
# Cloudflare numbers the week 1 = Sunday to 7 = Saturday, unlike the 0 = Sunday
# that most cron implementations (and every example you will find) use. This
# field first read `0,2-6`, correct in standard cron and rejected outright by the
# Cloudflare API - `invalid cron string [code: 10100]`, because 0 is out of
# range. The trap is the near-miss repair: bumping 0 to 1 and leaving `2-6`
# parses cleanly and means Mon-Fri, which runs on the single day it must not and
# skips both Sunday and Saturday. Nothing would fail; the report would just
# cover the wrong days forever. Cloudflare's own docs recommend the
# abbreviations for exactly this reason. If you ever do need numbers here, every
# day except Monday is `1,3-7`.
#
# ENABLED 2026-08-26. Setting this line does NOT start anything on its own - a
# cron trigger is only registered on the Worker by `npm run deploy`, and a
# deployed run still needs both secrets (REPORT_TOKEN, SLACK_WEBHOOK_URL) and an
# APP_URL that is not localhost. See README.md § Go live for the order.
#
# To switch it back off: set `crons = []` and deploy again. An empty list clears
# the registered schedule; DELETING this [triggers] block leaves it running.
[triggers]
crons = ["30 3 * * SUN,TUE-SAT"]

[vars]
# The deployed app. Not a secret. Override per environment.
APP_URL = "http://localhost:3000"

# Without this, a failed run is only visible in a live `wrangler tail` session
# that nobody is watching at 9am.
[observability]
enabled = true

# Secrets are NOT set here — they would be committed. Set them once with:
#   npx wrangler secret put REPORT_TOKEN
#   npx wrangler secret put SLACK_WEBHOOK_URL
